openapi: 3.0.1

info:
  title: Rapid7 InsightVM v4 API
  description: Clean minimal OpenAPI spec for Rapid7 InsightVM v4 (Security Copilot).
  version: "1.0.0"

servers:
  - url: https://eu.api.insight.rapid7.com/vm/v4

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

security:
  - ApiKeyAuth: []

paths:
  /integrations/assets:
    get:
      operationId: listAssets
      summary: List assets
      description: Returns a paginated list of assets.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: object
