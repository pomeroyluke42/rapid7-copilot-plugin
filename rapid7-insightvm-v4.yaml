openapi: 3.0.1

info:
  title: Rapid7 InsightVM v4 API
  description: InsightVM v4 API using integrations endpoints (Copilot compatible).
  version: "1.0.1"

servers:
  - url: https://eu.api.insight.rapid7.com/vm/v4

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

security:
  - ApiKeyAuth: []

paths:
  /integrations/assets:
    get:
      summary: List assets
      description: Retrieve a paginated list of assets from Rapid7 InsightVM.
      operationId: listAssets
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
